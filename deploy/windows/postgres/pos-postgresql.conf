# POS settings, pulled in by postgresql.conf via include_if_exists (see Initialize-PosCluster.ps1).
# Mirrors the Docker postgres:15 behaviour; do not edit per-site (port is set by the init script).
listen_addresses = 'localhost'
max_connections = 100
shared_buffers = 128MB
max_wal_size = 1GB
min_wal_size = 80MB
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
# the pg_ctl service has no console: without this the server log is lost (<Root>\pgdata\log)
logging_collector = on
log_directory = 'log'
# one file per weekday, overwritten on rotation: at most 7 files, no growth
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
