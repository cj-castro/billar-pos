# Native Windows nginx config — adapted from frontend/nginx.conf (SVC-03). Docker's frontend/nginx.conf is unchanged and still used by docker-compose.yml.
#
# UNLIKE the Docker version, this file is deployed as the entire, standalone
# C:\nginx\conf\nginx.conf for the native Windows nginx binary -- not as a
# server-block fragment included by a base image's own wrapping nginx.conf
# (which is how frontend/nginx.conf works inside the official nginx Docker
# image). A standalone nginx.conf requires "events {}" and the server block
# to live inside "http {}", or nginx fails immediately with "server
# directive is not allowed here" and refuses to start (confirmed against the
# real staging machine, 2026-08-08 -- nginx crash-looped until NSSM paused
# the service). Everything below events{}/http{} up to the server{} block is
# standard nginx.conf boilerplate; the server{} block itself is unchanged
# from the original bare fragment.
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

server {
    listen 8080;
    root C:/nginx/html;
    index index.html;

    # Reject oversized request bodies
    client_max_body_size 2m;

    # Never cache index.html so new deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed assets (JS/CSS): cache aggressively — hash changes on every build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }

    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep WebSocket connections alive during idle periods
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
}
