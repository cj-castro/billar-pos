services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billiardbar}
      POSTGRES_USER: ${POSTGRES_USER:-billiard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiard_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billiard} -d ${POSTGRES_DB:-billiardbar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billiardbar_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD:-billiard_secret}@postgres:5432/${POSTGRES_DB:-billiardbar}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      BILLING_MODE: ${BILLING_MODE:-PER_MINUTE}
      POOL_RATE_CENTS: ${POOL_RATE_CENTS:-150}
      HAPPY_HOUR_START: ${HAPPY_HOUR_START:-17:00}
      HAPPY_HOUR_END: ${HAPPY_HOUR_END:-20:00}
      HAPPY_HOUR_DISCOUNT_PCT: ${HAPPY_HOUR_DISCOUNT_PCT:-20}
      CURRENCY: ${CURRENCY:-MXN}
      TZ: ${TZ:-America/Mexico_City}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: wsgi.py
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-manager123}
      MANAGER_PIN: ${MANAGER_PIN:-5678}
      WAITER1_PASSWORD: ${WAITER1_PASSWORD:-waiter123}
      WAITER2_PASSWORD: ${WAITER2_PASSWORD:-waiter123}
      KITCHEN_PASSWORD: ${KITCHEN_PASSWORD:-kitchen123}
      BARSTAFF_PASSWORD: ${BARSTAFF_PASSWORD:-bar123}
      PRINT_AGENT_URL: ${PRINT_AGENT_URL:-http://host.docker.internal:9191}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORT_FROM: ${REPORT_FROM:-bola.8gdl@gmail.com}
      REPORT_TO: ${REPORT_TO:-bola.8gdl@gmail.com,isc.castro@gmail.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5000/api/v1/auth/me | grep -q msg"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - billiardbar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - billiardbar_net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["python", "scheduler.py"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD:-billiard_secret}@postgres:5432/${POSTGRES_DB:-billiardbar}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      TZ: ${TZ:-America/Mexico_City}
      FLASK_APP: wsgi.py
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORT_FROM: ${REPORT_FROM:-bola.8gdl@gmail.com}
      REPORT_TO: ${REPORT_TO:-bola.8gdl@gmail.com,isc.castro@gmail.com}
    networks:
      - billiardbar_net

  telegram-bot:
    build: 
      context: ./telegram-bot
      dockerfile: Dockerfile 
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD:-billiard_secret}@postgres:5432/${POSTGRES_DB:-billiardbar}
    networks:
      - billiardbar_net

  # Nightly pg_dump -Fc -> S3 at 04:30 (see README "Offsite backup").
  # NOTE: the ${VAR:?} checks apply to EVERY `docker compose` command, not just
  # this service, so the AWS_* / S3_BUCKET vars must be in .env first.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billiardbar}
      POSTGRES_USER: ${POSTGRES_USER:-billiard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required in .env}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required in .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required in .env}
      S3_PREFIX: ${S3_PREFIX:-billiardbar}
      TZ: America/Mexico_City
    # The postgres base image declares a data VOLUME; mount tmpfs over it so
    # docker does not create an unused anonymous volume on every recreate.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # healthy = a successful backup within the last 26h (1560 min)
      test: ["CMD-SHELL", "test -n \"$$(find /var/lib/backup/last_success -mmin -1560 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - billiardbar_net

volumes:
  pg_data:
    driver: local

networks:
  billiardbar_net:
    driver: bridge
