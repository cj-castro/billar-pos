server {
    listen 80;

    # Phase 3: explicit log paths for nginx's own HTTP access/error logs
    # (distinct from the NSSM wrapper stdout/stderr) -- Linux paths, since
    # this file ships inside the Docker nginx:1.27-alpine image (D-02).
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Reject oversized request bodies
    client_max_body_size 2m;

    # Never cache index.html so new deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed assets (JS/CSS): cache aggressively — hash changes on every build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }

    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep WebSocket connections alive during idle periods
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
