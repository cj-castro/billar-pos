name: release-images
# Builds the images the bar PC runs and pushes them to GHCR, tagged with the
# full commit SHA. Nothing reaches the bar until CJ promotes a SHA
# (promote-to-bar.yml moves the bar-stable tag). Not a required check: it
# runs only on main and by hand (a manual run from another branch builds
# nothing: the build job is limited to refs/heads/main).
#
# Images: ghcr.io/cj-castro/billar-pos-{backend,frontend,telegram-bot,backup,updater,release}.
# The scheduler runs the backend image. The release image (compose file +
# release.json) is pushed LAST, so a release tag implies the other five exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cj-castro

jobs:
  build:
    name: release-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the release files
        run: |
          set -e
          python3 release/test_make_release.py
          python3 release/test_cleanup_packages.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom off: one plain manifest per tag, so promote's retag
      # (bar-stable / bar-previous on all six packages) and the cleanup job
      # never meet untagged child manifests.
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/billar-pos-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_URL=/api/v1
            VITE_SOCKET_URL=/
          tags: ${{ env.REGISTRY }}/billar-pos-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: telegram-bot
        uses: docker/build-push-action@v6
        with:
          context: telegram-bot
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/billar-pos-telegram-bot:${{ github.sha }}
          cache-from: type=gha,scope=telegram-bot
          cache-to: type=gha,mode=max,scope=telegram-bot

      - name: backup
        uses: docker/build-push-action@v6
        with:
          context: backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/billar-pos-backup:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: updater
        uses: docker/build-push-action@v6
        with:
          context: updater
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/billar-pos-updater:${{ github.sha }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Render release.json and docker-compose.bar.yml
        run: python3 release/make_release.py --sha "${{ github.sha }}" --registry "$REGISTRY" --out release

      - name: Check the bar compose file
        run: |
          set -e
          printf 'BAR_HOST_DIR=/tmp/bar\n' > "$RUNNER_TEMP/dummy.env"
          docker compose -f release/docker-compose.bar.yml --env-file "$RUNNER_TEMP/dummy.env" config -q
          cat release/release.json

      - name: release
        uses: docker/build-push-action@v6
        with:
          context: release
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/billar-pos-release:${{ github.sha }}

  cleanup:
    name: release-images-cleanup
    needs: build
    runs-on: ubuntu-latest
    # One cleanup at a time, so two runs never delete the same version.
    concurrency:
      group: release-images-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Reads billar-pos-release first and protects the SHAs of its bar-stable
      # and bar-previous versions in EVERY package, plus anything tagged
      # bar-stable/bar-previous; keeps the newest 10 SHA tags per package and
      # never touches untagged versions. Release unreadable, or a bar-* tag
      # without a SHA tag: it deletes nothing (see release/cleanup_packages.py).
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 release/cleanup_packages.py --owner cj-castro --keep 10
