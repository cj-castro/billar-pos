# J5a: waiter deep-links into manager/kitchen routes -> denied.
# A waiter that deep-links into the manager (or kitchen) group is denied.
appId: com.bola8.staff
env:
  SERVER: 10.0.2.2:8090
  USER_NAME: waiter1
  PASS: waiter123
---
- runFlow: _login.yaml
- extendedWaitUntil:
    visible:
      id: screen-floor
    timeout: 20000
- openLink: bola8staff:///overview
- assertVisible: Esta sección no es para tu rol
- takeScreenshot: 16-access-denied
- tapOn:
    id: denied-home
- extendedWaitUntil:
    visible:
      id: screen-floor
    timeout: 10000
- openLink: bola8staff:///system
- assertVisible: Esta sección no es para tu rol
- openLink: bola8staff:///queue
- assertVisible: Esta sección no es para tu rol
