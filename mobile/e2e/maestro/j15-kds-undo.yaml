# J15: kitchen marks a line Listo, then taps Deshacer within 3 s -> line is back "En preparación". (Not run in CI.)
appId: com.bola8.staff
env:
  SERVER: 10.0.2.2:8090
  USER_NAME: kitchen
  PASS: kitchen123
---
- runFlow: _login.yaml
- extendedWaitUntil:
    visible:
      id: screen-kds
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chicken Wings
# iOS exposes the whole KDS row as one accessibility element ("Chicken Wings, Buffalo, ..."), so match by substring
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ".*Chicken Wings.*"
- assertVisible: ".*En preparación.*"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chicken Wings
# iOS exposes the whole KDS row as one accessibility element ("Chicken Wings, Buffalo, ..."), so match by substring
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ".*Chicken Wings.*"
- assertVisible: "Marcado como listo"
- tapOn:
    id: toast-action
- assertVisible: ".*En preparación.*"
- longPressOn:
    id: kds-logo
- assertVisible:
    id: kds-me-sheet
