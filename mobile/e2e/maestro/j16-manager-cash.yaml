# J16: manager opens the register with a float, adds an expense, counts the cash and closes it (not run in CI).
# Precondition: no open tickets and the register closed (or it is closed first by the cleanup at the end).
appId: com.bola8.staff
env:
  SERVER: 10.0.2.2:8090
  USER_NAME: manager
  PASS: manager123
---
- runFlow: _login.yaml
- extendedWaitUntil:
    visible:
      id: screen-overview
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Caja
# iOS labels bottom tabs as one accessibility element ("Caja, tab, 4 of 9"), so match by prefix (hidden tabs count too)
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Caja, tab.*"
- extendedWaitUntil:
    visible:
      id: screen-cash
    timeout: 10000
# State A -> open with a $500 float
- runFlow:
    when:
      visible:
        id: cash-open-btn
    commands:
      - tapOn:
          id: cash-open-btn
      # the amount "pad" is a decimal text field in the current app (was a keypad: fund-pad-5, fund-pad-00)
      - tapOn:
          id: fund-pad
      - inputText: "500"
      - runFlow: _hide-keyboard.yaml
      - assertVisible:
          id: fund-pad-amount
      - tapOn:
          id: open-cash-confirm
- extendedWaitUntil:
    visible:
      id: cash-summary
    timeout: 10000
- assertVisible:
    id: line-expected
# Expense
- tapOn:
    id: cash-add-expense
- tapOn:
    id: expense-description
- inputText: Hielo
- tapOn:
    id: expense-payee
- inputText: Proveedor
- tapOn:
    id: expense-amount
- inputText: "50"
- runFlow: _hide-keyboard.yaml
- tapOn:
    id: expense-save
- extendedWaitUntil:
    visible: Hielo
    timeout: 10000
- takeScreenshot: 16-cash-open
# Close: count $450 (500 float - 50 expense) and read the difference
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: cash-close-btn
    timeout: 5000
# iOS: the close button sits under the translucent tab bar after scrollUntilVisible's default stop, so a plain tap
# lands on a tab; centre it first
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: cash-close-btn
          centerElement: true
- tapOn:
    id: cash-close-btn
- extendedWaitUntil:
    visible:
      id: count-pad
    timeout: 5000
# the amount "pad" is a decimal text field in the current app (was a keypad: count-pad-4, -5, -0)
- tapOn:
    id: count-pad
- inputText: "450"
- runFlow: _hide-keyboard.yaml
- assertVisible:
    id: close-diff
- takeScreenshot: 16-cash-close-sheet
- tapOn:
    id: close-cash-confirm
- extendedWaitUntil:
    visible:
      id: cash-closed-summary
    timeout: 10000
- assertVisible:
    id: cash-closed-diff
- takeScreenshot: 16-cash-closed
